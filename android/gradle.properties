# Kept modest so the build fits on constrained machines — F-Droid's buildserver
# VM in particular. Raise locally if you have the headroom.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Flutter redirects every plugin module's build dir into one shared build/ folder
# (see android/build.gradle.kts). The long-lived Kotlin daemon keeps FilePageCache
# registrations keyed by absolute path, so those paths collide between modules and
# across builds — "Storage for [...] is already registered", then "Could not close
# incremental caches". Compiling in-process gives each build fresh state and removes
# the collision without giving up incremental compilation.
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
